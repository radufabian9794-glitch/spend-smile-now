# Adds Caddy as a TLS-terminating reverse proxy in front of the app + Supabase
# on :8080 / :8443. The direct :3000 (app) and :8000 (kong) ports defined in
# docker-compose.yml remain published so you can still reach the app on the LAN
# without going through Caddy. To make traffic flow ONLY through Caddy, add
# `ports: !reset []` under `app` and `kong` here.

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app, kong]
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [supabase]

volumes:
  caddy-data:
  caddy-config:
